name: Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test, lint, compile instrumentation tests, and build release
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:compileDebugAndroidTestKotlin :app:assembleRelease

      - name: Run instrumentation tests on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: maktaba-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
